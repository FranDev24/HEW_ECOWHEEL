<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ecowheel — Heliomorfismo</title>
<meta name="description" content="Ecowheel: rueda de azar con efecto Heliomorfismo inspirado en el comportamiento del helio líquido." />
<link rel="stylesheet" href="style.css?v=20260913-5" />
</head>
<body class="theme-night">

  <!-- Filtro SVG que deforma el borde del anillo como helio líquido -->
  <svg width="0" height="0" style="position:absolute">
    <filter id="helio-warp" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.012 0.028" numOctaves="2" seed="7" result="noise">
        <animate attributeName="baseFrequency" dur="14s" values="0.012 0.028;0.02 0.014;0.012 0.028" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <filter id="helio-warp-strong" x="-60%" y="-60%" width="220%" height="220%">
      <feTurbulence id="turb-strong" type="fractalNoise" baseFrequency="0.03 0.06" numOctaves="3" seed="3" result="noise2">
        <animate attributeName="baseFrequency" dur="1.4s" values="0.03 0.06;0.08 0.02;0.03 0.06" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise2" scale="46" xChannelSelector="R" yChannelSelector="G" />
    </filter>

  </svg>

  <div class="stage" id="stage">

    <!-- Vapor / niebla criogénica de fondo -->
    <canvas id="fog-canvas"></canvas>

    <!-- Barra superior -->
    <header class="topbar">
      <button id="back-btn" class="pill-glass icon-btn" aria-label="Volver al panel" title="Volver al panel">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="pill-glass brand">
        <span class="brand-dot"></span>
        <span class="brand-label">ECOWHEEL</span>
      </div>

      <div class="topbar-actions">
        <button id="theme-btn" class="pill-glass icon-btn" type="button" aria-label="Cambiar tema" title="Día / Noche">
          <svg id="theme-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.35-.02-.7-.05-1.04A7 7 0 0 1 12 3Z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Pantalla 1: rueda / botón de giro -->
    <main class="screen" id="screen-spin">
      <div class="wheel-wrap">
        <canvas id="particle-canvas" width="640" height="640"></canvas>

        <div class="ring-outer" id="ring-outer"></div>

        <button id="spin-btn" class="spin-btn" type="button" aria-label="Girar Ecowheel" aria-busy="false">
          <svg viewBox="0 0 200 200" class="ring-svg" aria-hidden="true">
            <circle id="ring-jagged" cx="100" cy="100" r="72" class="ring-jagged" />
          </svg>
          <span class="spin-letter">H</span>
        </button>
      </div>

      <p class="hint" id="hint-text" aria-live="polite">Toca el núcleo para iniciar el giro</p>
    </main>

    <!-- Pantalla 2: resultado -->
    <section class="screen screen-result" id="screen-result" hidden>
      <div class="result-card pill-glass-strong">
        <img id="result-image" alt="" decoding="async" />
      </div>

      <div class="pill-glass question-pill" id="question-pill">
        <span id="question-text" role="status" aria-live="polite">¿Qué es un spin?</span>
      </div>

      <button id="learn-more-btn" class="pill-glass learn-more-btn" type="button" hidden>
        Aprender más
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></svg>
      </button>
      <p class="learn-more-info" id="learn-more-info" aria-live="polite" hidden></p>

    </section>

  </div>

  <script src="config.js?v=20260913-5"></script>
  <script src="app.js?v=20260913-5"></script>
</body>
</html>
