<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- HEW logo EXACTO de la referencia: circulo exterior + H de trazo grueso.
       IZQ: 5 arcos convergentes que se juntan arriba/abajo en la H.
       DER: borde exterior de la H + 4 ondas flotantes internas.
       viewBox 240 con padding para que el glow CSS no recorte el trazo. -->
  <g stroke="#FFFFFF" stroke-width="7">
    <!-- circulo exterior del logo (parte del logo, NO del anillo animado) -->
    <circle cx="120" cy="120" r="102"/>
    <!-- H: puente superior con esquinas redondeadas -->
    <path d="M84 64 L84 104 Q84 114 94 114 L146 114 Q156 114 156 104 L156 64"/>
    <!-- H: puente inferior con esquinas redondeadas -->
    <path d="M84 176 L84 136 Q84 126 94 126 L146 126 Q156 126 156 136 L156 176"/>
    <!-- IZQ: 5 arcos convergentes (nacen/mueren en la barra izq de la H) -->
    <path d="M84 64 C32 82 32 158 84 176"/>
    <path d="M88 66 C44 82 44 158 88 174"/>
    <path d="M92 70 C56 84 56 156 92 170"/>
    <path d="M94 76 C66 88 66 152 94 164"/>
    <path d="M94 88 C74 96 74 144 94 152"/>
    <!-- DER: borde exterior de la barra derecha de la H -->
    <path d="M156 64 C208 82 208 158 156 176"/>
    <!-- DER: 4 ondas flotantes internas (puntas redondas, sin tocar la H) -->
    <path d="M190 84 C204 96 204 144 190 156"/>
    <path d="M180 92 C196 102 196 138 180 148"/>
    <path d="M170 100 C184 108 184 132 170 140"/>
    <path d="M160 108 C170 112 170 128 160 132"/>
  </g>
</svg>
