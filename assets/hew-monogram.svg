<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- HEW EXACTO ref magenta/negra: circulo + H gruesa outline.
       IZQ: vertical + 4 arcos anidados que convergen ARRIBA/ABAJO en el mismo punto.
       DER: verticales sup/inf + borde exterior curvo + 4 ondas flotantes SIN tocar.
       Puente medio DOBLE (barra gruesa outline: sup + inf con hueco). -->
  <g stroke="#FFFFFF" stroke-width="5">
    <!-- circulo exterior del logo -->
    <circle cx="100" cy="100" r="88"/>
    <!-- IZQ: espina vertical (borde interno de la pata izq) -->
    <path d="M62 48 L62 152"/>
    <!-- IZQ: 4 arcos anidados, mismos extremos (62,48)-(62,152), bulto a la izq -->
    <path d="M62 48 C14 60 14 140 62 152"/>
    <path d="M62 48 C26 62 26 138 62 152"/>
    <path d="M62 48 C38 66 38 134 62 152"/>
    <path d="M62 48 C48 72 48 128 62 152"/>
    <!-- DER: bordes internos verticales (de la tapa sup al puente sup, y del inf al inf) -->
    <path d="M138 48 L138 88"/>
    <path d="M138 112 L138 152"/>
    <!-- DER: borde exterior curvo (tapa sup a tapa inf, bulto a la der) -->
    <path d="M138 48 C186 60 186 140 138 152"/>
    <!-- DER: 4 ondas flotantes internas (no tocan nada), bulto a la der -->
    <path d="M128 60 C166 74 166 126 128 140"/>
    <path d="M126 70 C156 82 156 118 126 130"/>
    <path d="M124 80 C146 90 146 110 124 120"/>
    <path d="M122 90 C134 96 134 104 122 110"/>
    <!-- Puentes medios DOBLES (borde sup e inf de la barra gruesa central) -->
    <path d="M62 88 L138 88"/>
    <path d="M62 112 L138 112"/>
  </g>
</svg>
